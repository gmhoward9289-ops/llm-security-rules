name: test

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes. The default token permission on older repos is
# contents: write, which this job would inherit for no reason.
permissions:
  contents: read

jobs:
  semgrep-test:
    # Choose the runner from the repo's own visibility, evaluated at run time.
    #
    # Private: minutes are metered and there are no forks, so every job runs
    # first-party code. The swamplink self-hosted runner is free and safe here,
    # which is the reason it exists.
    #
    # Public: minutes are free and unmetered, so the runner buys nothing -- and
    # a fork PR supplies its own run-tests.sh, which this job executes. That is
    # arbitrary attacker code on our own hardware.
    #
    # If `repository` is ever missing from the event payload, `private` is null,
    # which is falsy. This fails closed to ubuntu-latest by design.
    #
    # IMPORTANT -- this expression is correctness, NOT a security boundary. For
    # `pull_request` events GitHub reads the workflow file from the PR's merge
    # ref, so a fork PR can simply rewrite this line back to self-hosted. What
    # actually protects the runner while the repo is public is that the runner
    # is not registered, plus fork-PR approval required for all outside
    # collaborators. Re-register the runner only if this repo goes private.
    runs-on: ${{ github.event.repository.private && fromJSON('["self-hosted", "swamplink"]') || 'ubuntu-latest' }}
    steps:
      # Third-party actions are SHA-pinned, not tag-pinned: a tag is mutable, so
      # `@v4` means "whatever that owner points it at today". This ruleset tells
      # its users to pin exact revisions; the repo should hold itself to that.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          # Don't leave the job token in .git/config in the self-hosted
          # runner's workspace; nothing below talks to git.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install semgrep

      - name: Validate rules
        run: semgrep --validate --config rules/

      - name: Run rule tests
        run: ./run-tests.sh

  # The action in this repo runs inside other people's CI, so a template
  # injection here is a vulnerability in their runners, not ours. That bug
  # shipped once already (fixed in 3c90f54); this job is what makes it not
  # ship twice.
  #
  # Deliberately on a hosted runner even while semgrep-test is self-hosted:
  # it needs `docker run`, and the swamplink runner is itself a container --
  # granting it the host Docker socket is a bad trade in a security-rules repo.
  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: No GitHub expressions interpolated into shell scripts
        run: ./scripts/check-workflow-injection.sh
      - name: actionlint
        run: |
          set -euo pipefail
          # Pinned by digest so a compromised tag cannot alter what lints us.
          # Files are passed explicitly rather than letting actionlint discover
          # them: discovery walks up for a git root, which is absent when the
          # checkout is a worktree or a bare copy, and it fails with an error
          # that reads like a lint failure rather than a setup problem.
          docker run --rm \
            -v "$PWD:/repo:ro" -w /repo \
            --network none --cap-drop ALL --security-opt no-new-privileges \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -config-file .github/actionlint.yaml -color .github/workflows/*.yml

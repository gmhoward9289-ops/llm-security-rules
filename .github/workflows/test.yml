name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  semgrep-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install semgrep
        run: pip install semgrep
      - name: Validate rules
        run: semgrep --validate --config rules/
      - name: Run rule tests
        run: ./run-tests.sh

name: Codespell

on:
  push:
  pull_request:

jobs:
  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@v2
        with:
          path: rules,scripts,docs,.
          skip: .git,*.pyc,__pycache__,tests
          ignore_words_list: retuned

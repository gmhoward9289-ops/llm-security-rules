name: llm-security-rules
description: >-
  Scan the repository for LLM application security issues (OWASP LLM Top 10
  mapped) using semgrep and the llm-security-rules ruleset.
branding:
  icon: shield
  color: purple
inputs:
  paths:
    description: Space-separated paths to scan.
    required: false
    default: "."
  semgrep-version:
    description: semgrep version to install.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Install semgrep
      shell: bash
      env:
        SEMGREP_VERSION: ${{ inputs.semgrep-version }}
      run: |
        if [ -n "$SEMGREP_VERSION" ]; then
          pip install "semgrep==$SEMGREP_VERSION"
        else
          pip install semgrep
        fi
    - name: Scan
      shell: bash
      env:
        SCAN_PATHS: ${{ inputs.paths }}
        RULES_DIR: ${{ github.action_path }}/rules
      run: |
        # Nothing is interpolated into this script body. Every ${{ }} above is
        # bound to an env var instead, because GitHub expands ${{ }} textually
        # before bash ever sees the script -- a raw interpolation lets shell
        # metacharacters in a value become shell syntax. An env var is passed
        # as data; bash word-splits it but never re-parses it as code.
        #
        # github.action_path is GitHub-controlled rather than user-controlled,
        # so interpolating it was not exploitable. It is bound here anyway: one
        # exception to "no interpolation in a run block" is what a later edit
        # copies when adding a value that IS attacker-controlled.
        #
        # SCAN_PATHS is deliberately unquoted -- inputs.paths is documented as
        # space-separated, so word-splitting into multiple path args is the
        # point. RULES_DIR is quoted; it is a single path.
        semgrep scan --config "$RULES_DIR" --error $SCAN_PATHS

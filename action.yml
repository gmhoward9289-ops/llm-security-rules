name: llm-security-rules
description: >-
  Scan the repository for LLM application security issues (OWASP LLM Top 10
  mapped) using semgrep and the llm-security-rules ruleset.
branding:
  icon: shield
  color: purple
inputs:
  paths:
    description: Space-separated paths to scan.
    required: false
    default: "."
  semgrep-version:
    description: >-
      semgrep version to install. Defaults to a pinned release rather than
      whatever PyPI currently serves -- an unpinned install would make every
      downstream CI run trust a package this action never reviewed, which is
      the supply-chain failure llm03's trust-remote-code-enabled rule exists
      to flag. Bump this deliberately; do not replace it with a floating install.
    required: false
    default: "1.172.0"
runs:
  using: composite
  steps:
    - name: Install semgrep
      shell: bash
      env:
        SEMGREP_VERSION: ${{ inputs.semgrep-version }}
      run: |
        set -euo pipefail
        if [ -n "$SEMGREP_VERSION" ]; then
          pip install "semgrep==$SEMGREP_VERSION"
        else
          # Reachable only if a caller explicitly passes an empty string, which
          # opts them out of the pinned default. Honour it -- someone may need
          # to test against a prerelease -- but say so loudly, because the
          # result is that this action installs unreviewed code into their CI.
          echo "::warning::semgrep-version is empty; installing an unpinned semgrep. Pin a version for reproducible, reviewable CI."
          pip install semgrep
        fi
    - name: Scan
      shell: bash
      env:
        SCAN_PATHS: ${{ inputs.paths }}
      run: |
        # SCAN_PATHS is intentionally unquoted: inputs.paths is documented as
        # space-separated, so word-splitting into multiple path args is the
        # point. What matters is that it arrives via env: rather than as a
        # GitHub expression pasted into this script. GitHub expands expressions
        # textually before bash ever parses the file, so an interpolated input
        # becomes program text and its metacharacters become shell syntax; an
        # env var arrives as data, which bash word-splits but never re-parses
        # as code. scripts/check-workflow-injection.sh enforces this -- and it
        # flags expressions in comments too, since textual expansion does not
        # respect a leading '#'. That is why this note spells the syntax out
        # instead of quoting it.
        semgrep scan --config "${{ github.action_path }}/rules" --error $SCAN_PATHS

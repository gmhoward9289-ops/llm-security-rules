rules:
  - id: hardcoded-api-key-in-llm-client-js
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      LLM client constructed with a hardcoded API key string literal. Anyone
      with repo access — and anyone who receives the client bundle, if this
      ships to the browser — can read and use this key. Load it from the
      environment (the SDKs read OPENAI_API_KEY / ANTHROPIC_API_KEY
      automatically) and rotate the committed key.
    metadata:
      category: security
      subcategory: [secrets]
      owasp-llm: "LLM02:2025 Sensitive Information Disclosure"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
      references:
        - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
    patterns:
      - pattern-either:
          - pattern: |
              new OpenAI({..., apiKey: "...", ...})
          - pattern: |
              new Anthropic({..., apiKey: "...", ...})
          - pattern: |
              createOpenAI({..., apiKey: "...", ...})
          - pattern: |
              createAnthropic({..., apiKey: "...", ...})
          - pattern: |
              createGoogleGenerativeAI({..., apiKey: "...", ...})
          - pattern: new GoogleGenerativeAI("...")

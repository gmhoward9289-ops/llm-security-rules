rules:
  - id: openai-api-key-literal
    languages: [regex]
    severity: ERROR
    message: >-
      Hardcoded OpenAI API key. Modern OpenAI keys embed the marker "T3BlbkFJ";
      legacy keys are sk- followed by 48 characters. Move the key to an
      environment variable or secrets manager and rotate it — committed keys
      must be treated as compromised.
    metadata:
      category: security
      subcategory: [secrets]
      owasp-llm: "LLM02:2025 Sensitive Information Disclosure"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
      references:
        - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
    patterns:
      - pattern-either:
          - pattern-regex: \bsk-(?:proj|svcacct|admin)-[A-Za-z0-9_-]{20,}T3BlbkFJ[A-Za-z0-9_-]{20,}\b
          - pattern-regex: \bsk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20}\b
          - pattern-regex: \bsk-[A-Za-z0-9]{48}\b

  - id: anthropic-api-key-literal
    languages: [regex]
    severity: ERROR
    message: >-
      Hardcoded Anthropic API key (sk-ant- prefix). Move it to an environment
      variable or secrets manager and rotate it — committed keys must be
      treated as compromised.
    metadata:
      category: security
      subcategory: [secrets]
      owasp-llm: "LLM02:2025 Sensitive Information Disclosure"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
      references:
        - https://genai.owasp.org/llmrisk/llm022025-sensitive-information-disclosure/
    patterns:
      - pattern-regex: \bsk-ant-(?:api|admin)[0-9]{2}-[A-Za-z0-9_-]{24,}\b

  - id: google-api-key-literal
    languages: [regex]
    severity: WARNING
    message: >-
      Hardcoded Google API key (AIza prefix). If this key is enabled for the
      Gemini API it grants billable model access and must be moved to an
      environment variable and rotated. Note the same prefix is used by
      Firebase web client keys, which are designed to ship publicly — check
      which APIs the key is enabled for and restrict it before dismissing
      this finding.
    metadata:
      category: security
      subcategory: [secrets]
      owasp-llm: "LLM02:2025 Sensitive Information Disclosure"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: MEDIUM
    patterns:
      - pattern-regex: \bAIza[0-9A-Za-z_-]{35}\b

  - id: huggingface-token-literal
    languages: [regex]
    severity: ERROR
    message: >-
      Hardcoded Hugging Face access token (hf_ prefix). Tokens can read private
      models and datasets. Move it to an environment variable or secrets
      manager and rotate it.
    metadata:
      category: security
      subcategory: [secrets]
      owasp-llm: "LLM02:2025 Sensitive Information Disclosure"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    patterns:
      - pattern-regex: \bhf_[A-Za-z0-9]{34,}\b

  - id: openrouter-api-key-literal
    languages: [regex]
    severity: ERROR
    message: >-
      Hardcoded OpenRouter API key (sk-or-v1- prefix). Move it to an
      environment variable or secrets manager and rotate it.
    metadata:
      category: security
      subcategory: [secrets]
      owasp-llm: "LLM02:2025 Sensitive Information Disclosure"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    patterns:
      - pattern-regex: \bsk-or-v1-[a-f0-9]{64}\b

  - id: groq-api-key-literal
    languages: [regex]
    severity: ERROR
    message: >-
      Hardcoded Groq API key (gsk_ prefix). Move it to an environment variable
      or secrets manager and rotate it.
    metadata:
      category: security
      subcategory: [secrets]
      owasp-llm: "LLM02:2025 Sensitive Information Disclosure"
      cwe: "CWE-798: Use of Hard-coded Credentials"
      confidence: HIGH
    patterns:
      - pattern-regex: \bgsk_[A-Za-z0-9]{52}\b

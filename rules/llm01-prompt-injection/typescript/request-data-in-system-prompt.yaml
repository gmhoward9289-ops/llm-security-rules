rules:
  - id: request-data-in-system-prompt-js
    languages: [typescript, javascript]
    severity: ERROR
    mode: taint
    message: >-
      HTTP request data flows into a system prompt. The system role is the
      trust boundary of an LLM call: content there is treated as
      instructions, so request-controlled text in it is direct prompt
      injection — an attacker rewrites your agent's rules. Put user data in a
      user-role message and keep the system prompt static.
    metadata:
      category: security
      subcategory: [prompt-injection]
      owasp-llm: "LLM01:2025 Prompt Injection"
      cwe: "CWE-77: Improper Neutralization of Special Elements used in a Command"
      confidence: HIGH
      references:
        - https://genai.owasp.org/llmrisk/llm012025-prompt-injection/
    pattern-sources:
      - pattern: req.body
      - pattern: req.query
      - pattern: req.params
      - pattern: request.body
      - pattern: request.query
      - pattern: request.params
    pattern-sinks:
      - patterns:
          - pattern: |
              {role: "system", content: $CONTENT}
          - focus-metavariable: $CONTENT
      - patterns:
          - pattern: |
              generateText({..., system: $SYS, ...})
          - focus-metavariable: $SYS
      - patterns:
          - pattern: |
              streamText({..., system: $SYS, ...})
          - focus-metavariable: $SYS
      - patterns:
          - pattern: |
              $CLIENT.messages.create({..., system: $SYS, ...})
          - focus-metavariable: $SYS
